name: Validate ARX UI Spec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"

      - name: Validate ARX UI Spec contract
        run: python scripts/validate_contract.py

      - name: Verify canonical and Codex skill mirrors
        run: diff -ru skills/arx-ui-spec plugins/arx-ui-spec/skills/arx-ui-spec

      - name: Verify required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f skills/arx-ui-spec/SKILL.md
          test -f skills/arx-ui-spec/agents/openai.yaml
          test -f schemas/design-spec.schema.json
          test -f scripts/validate_contract.py
          test -f plugins/arx-ui-spec/.codex-plugin/plugin.json
          test -f plugins/arx-ui-spec/skills/arx-ui-spec/agents/openai.yaml
          test -f .agents/plugins/marketplace.json
